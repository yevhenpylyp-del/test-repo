extends:
  - minimal
rules:
  operation-tag-defined: error
  no-invalid-schema-examples: error
  no-invalid-media-type-examples: error
  scalar-property-missing-example: error
  rule/operation-summary-sentence-case:
    subject:
      type: Operation
      property: summary
    message: Operation summary must be sentence cased.
    assertions:
      pattern: /^([A-Z]{2,}|[A-Z][^A-Z]*)\b(\s+(?:[A-Z]{2,}|[^A-Z]*)\b)*$/ # Sentence case but allow acronyms
  rule/example-summary-sentence-case:
    subject:
      type: Example
      property: summary
    message: Example summary must be sentence cased.
    assertions:
      pattern: /^([A-Z]{2,}|[A-Z][^A-Z]*)\b(\s+(?:[A-Z]{2,}|[^A-Z]*)\b)*$/ # Sentence case but allow acronyms

ignore:
  - .github

# SEO configuration for the portal
seo:
  title: "SportShop API Docs"

# API definition
apis:
  sportshop-api@v1:
    root: apis/openapi.yaml

logo:
  srcSet: "./images/logo-light.svg light, ./images/logo-dark.svg dark"
  altText: SportShop

# Navigation footer
footer:
  copyrightText: "© 2026 SportShop Retail"
  items:
    - group: Product
      items:
        - page: docs/getting-started/index.md
          label: Getting Started
        - page: docs/guides/index.md
          label: Guides
        - page: apis/openapi.yaml
          label: API Reference
    - group: Support
      items:
        - page: docs/index.md
          label: Documentation

navbar:
  items:
    - page: index.md
      label: Home
    - page: docs/index.md
      label: Documentation
    - page: apis/openapi.yaml
      label: API Reference
