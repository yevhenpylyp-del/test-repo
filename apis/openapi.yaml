openapi: 3.1.0
info:
  title: SportShop Commerce API
  version: 1.0.0
  description: >-
    > ⚠️ This is an AI-generated starter API definition based on your project
    description — not your real API. Replace it with your actual OpenAPI definition.

    A comprehensive commerce API for managing athletic equipment, apparel, and customer orders for a sporting goods retail platform.
servers:
  - url: https://api.example.com
    description: Sandbox environment
paths:
  /products:
    get:
      summary: List sports equipment and apparel
      parameters:
        - name: category
          in: query
          schema:
            type: string
          examples:
            footwear:
              value: footwear
      responses:
        '200':
          description: A list of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
  /products/{id}:
    get:
      summary: Get product details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detailed product information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
  /cart:
    post:
      summary: Add item to shopping cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: string
                quantity:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: Item added successfully
  /orders:
    post:
      summary: Place a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
    get:
      summary: List customer order history
      responses:
        '200':
          description: A list of previous orders
  /inventory/{sku}:
    get:
      summary: Check stock levels for a specific SKU
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current stock count
          content:
            application/json:
              schema:
                type: object
                properties:
                  sku:
                    type: string
                  available:
                    type: integer

components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        brand:
          type: string
        price:
          type: number
          format: float
        category:
          type: string
          enum: [footwear, apparel, equipment, accessories]
        tags:
          type: array
          items:
            type: string
    OrderRequest:
      type: object
      required:
        - items
        - shippingAddress
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              quantity:
                type: integer
        shippingAddress:
          type: object
          properties:
            street:
              type: string
            city:
              type: string
            postalCode:
              type: string
            country:
              type: string